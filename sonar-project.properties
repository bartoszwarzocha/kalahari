# SonarQube analysis of Kalahari (local server, http://localhost:9000).
#
# Run it with scripts/sonar_analysis.py: the script prepares what the C++ part
# needs (compilation database and clang-tidy report) and then starts
# sonar-scanner in the repository root. The token comes from the SONAR_TOKEN
# environment variable and is never stored in this file.
#
# C++ is analysed by the community plugin sonar-cxx (language key "cxx"),
# because SonarQube Community Build has no C/C++ analyser of its own.

sonar.projectKey=kalahari
sonar.projectName=Kalahari
sonar.sourceEncoding=UTF-8

# --- What is analysed -------------------------------------------------------
# Program code, its resources, build files and the project's own scripts.
sonar.sources=src,include,resources,scripts,tools,cmake,.github,CMakeLists.txt,CMakePresets.json,vcpkg.json
sonar.tests=tests

# Third-party icon sets and bitmap images are not project code.
sonar.exclusions=resources/icons/**,resources/images/**

# --- C++ (sonar-cxx) --------------------------------------------------------
# The plugin's C++ sensor stays off until the file suffixes are set.
sonar.cxx.file.suffixes=.cpp,.h
# Include paths and macros of every translation unit (CMake, Ninja generator).
# The plugin reads -I and -D from it, not MSVC's -external:I, so Qt's headers stay
# unread: its lexer fails on them (98 files "Unable to parse file" when they were given).
sonar.cxx.jsonCompilationDatabase=build-windows/compile_commands.json
# Qt's keywords and class macros, so the plugin's parser reads Qt classes without
# Qt's headers (one macro per line, written like #define without the keyword).
sonar.cxx.defines=Q_OBJECT\n\
  Q_GADGET\n\
  Q_NAMESPACE\n\
  signals public\n\
  Q_SIGNALS public\n\
  slots\n\
  Q_SLOTS\n\
  emit\n\
  Q_EMIT\n\
  Q_SIGNAL\n\
  Q_SLOT\n\
  Q_INVOKABLE\n\
  Q_SCRIPTABLE\n\
  Q_PROPERTY(...)\n\
  Q_ENUM(x)\n\
  Q_FLAG(x)\n\
  Q_ENUM_NS(x)\n\
  Q_FLAG_NS(x)\n\
  Q_INTERFACES(x)\n\
  Q_CLASSINFO(name, value)\n\
  Q_PLUGIN_METADATA(x)\n\
  Q_DECLARE_METATYPE(type)\n\
  Q_DECLARE_INTERFACE(iface, iid)\n\
  Q_DECLARE_FLAGS(flags, enumType) typedef QFlags<enumType> flags;\n\
  Q_DECLARE_OPERATORS_FOR_FLAGS(flags)\n\
  Q_DECLARE_TR_FUNCTIONS(context)\n\
  Q_DISABLE_COPY(type)\n\
  Q_DISABLE_COPY_MOVE(type)\n\
  QT_BEGIN_NAMESPACE\n\
  QT_END_NAMESPACE\n\
  QT_VERSION_CHECK(major, minor, patch) ((major << 16) | (minor << 8) | (patch))
# clang-tidy diagnostics written by scripts/sonar_analysis.py.
sonar.cxx.clangtidy.reportPaths=build-windows/sonar/clang-tidy.txt
