name: AUTOMAT

# The external test automaton (tests/automat). The probe checks, on a GitHub Windows machine,
# that real mouse and keyboard input, Qt's UI Automation, window events, the busy probe,
# screenshots and the clipboard work, using a small Qt program (not Kalahari).

on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'tests/automat/**', '.github/workflows/automat-windows.yml' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe of the Windows machine
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the automaton's packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/automat/requirements.txt "PySide6>=6.9,<6.10" dxcam

    - name: Run the probe
      run: python tests/automat/probe/probe.py --out probe-out

    - name: Upload the probe's report and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automat-probe
        path: probe-out
        retention-days: 14
