name: AUTOMAT

# The external test automaton (tests/automat).
# - unit: the automaton's own tests and the scenario check (any machine, no program).
# - kalahari: builds Kalahari (Release) and runs every scenario against the real program on
#   a GitHub Windows machine; the job log carries every step, check, time and the UI
#   Automation trees the run saved, so a run can be read without the artifact.
# - probe: the probe of the Windows machine with a small Qt program (on request only).

on:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'tests/automat/**', '.github/workflows/automat-windows.yml' ]
  workflow_dispatch:
    inputs:
      probe:
        description: 'Also run the probe of the Windows machine'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Automaton tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/automat
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the automaton's packages
      run: python -m pip install -r requirements.txt

    - name: Run the automaton's tests
      run: python -m unittest discover -s tests -t . -v

    - name: Check the scenarios
      run: python -m automat lista

  kalahari:
    name: Scenarios on Kalahari (Windows)
    runs-on: windows-latest
    timeout-minutes: 120  # Qt6 via vcpkg takes a long time without a warm binary cache
    permissions:
      contents: read
      actions: read  # to find and download a build of the same program from an earlier run
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      PYTHONUTF8: '1'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false

    # The program is built once for each version of its code: a run that changes only the
    # automaton or its scenarios takes the program an earlier run built (an artifact, not
    # the cache, so main's vcpkg cache keeps its room).
    - name: Find a build of this version of the program
      id: program
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: kalahari-program-${{ hashFiles('src/**', 'include/**', 'resources/**', 'translations/**', 'plugins/**', 'cmake/**', 'CMakeLists.txt', 'vcpkg.json', 'vcpkg-ports/**') }}
      run: |
        "name=$env:NAME" >> $env:GITHUB_OUTPUT
        $found = gh api "repos/${{ github.repository }}/actions/artifacts?name=$env:NAME&per_page=5" | ConvertFrom-Json
        $live = @($found.artifacts | Where-Object { -not $_.expired })
        if ($live.Count -gt 0) {
          "run_id=$($live[0].workflow_run.id)" >> $env:GITHUB_OUTPUT
          Write-Host "The program was built in run $($live[0].workflow_run.id)"
        } else {
          Write-Host "No build of this version yet: building it"
        }

    - name: Download the program
      if: steps.program.outputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ steps.program.outputs.name }}
        path: build
        run-id: ${{ steps.program.outputs.run_id }}
        github-token: ${{ github.token }}

    - name: Free disk space
      if: steps.program.outputs.run_id == ''
      shell: pwsh
      run: |
        if (Test-Path "C:\Android") { Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue }
        if (Test-Path "C:\hostedtoolcache\CodeQL") { Remove-Item -Recurse -Force "C:\hostedtoolcache\CodeQL" -ErrorAction SilentlyContinue }

    - name: Initialize vcpkg submodule (full clone)
      if: steps.program.outputs.run_id == ''
      shell: powershell
      run: |
        git submodule update --init --recursive
        cd vcpkg
        $isShallow = git rev-parse --is-shallow-repository
        if ($isShallow -eq "true") {
          git fetch --unshallow 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "Already unshallowed or error (continuing)" }
        }

    - name: Setup MSVC (Visual Studio BuildTools)
      if: steps.program.outputs.run_id == ''
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake and Ninja
      if: steps.program.outputs.run_id == ''
      run: choco install cmake ninja -y

    - name: Install autotools (for vcpkg Python build)
      if: steps.program.outputs.run_id == ''
      continue-on-error: true
      run: |
        choco install msys2 -y
        C:\tools\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm autoconf autoconf-archive automake libtool"

    - name: Prepare vcpkg binary cache directory
      if: steps.program.outputs.run_id == ''
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

    # Main's cache (saved by the WINDOWS workflow); this workflow only reads it.
    - name: Restore vcpkg binary cache
      if: steps.program.outputs.run_id == ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: windows-msvc-vcpkg-binary-v1-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          windows-msvc-vcpkg-binary-v1-${{ hashFiles('vcpkg.json') }}-
          windows-msvc-vcpkg-binary-v1-

    - name: Bootstrap vcpkg
      if: steps.program.outputs.run_id == ''
      shell: powershell
      run: |
        if (!(Test-Path "vcpkg/vcpkg.exe")) {
          cd vcpkg
          .\bootstrap-vcpkg.bat
        }

    - name: Configure CMake
      if: steps.program.outputs.run_id == ''
      run: |
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -G Ninja
      env:
        CC: cl
        CXX: cl

    - name: Build Kalahari
      if: steps.program.outputs.run_id == ''
      run: cmake --build build --config Release --target kalahari --parallel

    # The program with its libraries, plugins and resources, and the Python it finds beside
    # the build (src/core/python_interpreter.cpp, detectPythonHome)
    - name: Keep the program for later runs
      if: steps.program.outputs.run_id == ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.program.outputs.name }}
        path: |
          build/bin
          build/vcpkg_installed/x64-windows/tools/python3
        retention-days: 5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the automaton's packages
      run: python -m pip install -r tests/automat/requirements.txt

    - name: Does the automaton's input reset the idle timer
      continue-on-error: true
      run: python tests/automat/probe/idle_check.py

    - name: Run every scenario
      id: run
      continue-on-error: true
      working-directory: tests/automat
      run: >
        python -m automat uruchom --wszystkie
        --program "${{ github.workspace }}\build\bin\kalahari.exe"
        --results "${{ github.workspace }}\automat-wyniki"
        --gdzie "GitHub (windows-latest)"

    - name: The run in the log
      if: always()
      run: python tests/automat/ci_report.py "${{ github.workspace }}\automat-wyniki"

    - name: Upload the run's results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automat-wyniki
        path: automat-wyniki
        retention-days: 14

    - name: Fail when a scenario failed
      if: steps.run.outcome != 'success'
      run: exit 1

  probe:
    name: Probe of the Windows machine
    if: github.event_name == 'workflow_dispatch' && inputs.probe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the automaton's packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/automat/requirements.txt "PySide6>=6.9,<6.10"

    - name: Run the probe
      run: python tests/automat/probe/probe.py --out probe-out

    - name: Upload the probe's report and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automat-probe
        path: probe-out
        retention-days: 14
