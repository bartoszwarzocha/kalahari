name: MACOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# A new push to a pull request cancels the pull request's runs still in progress;
# every run on main and develop runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: macOS Build & Test
    # Pinned: macos-latest moved to a newer Xcode whose clang rejects Qt 6.9.1
    # (qyieldcpu.h: implicit declaration of __yield). Unpin after the vcpkg
    # baseline brings a Qt version with the upstream fix.
    runs-on: macos-15
    timeout-minutes: 120  # Qt6 via vcpkg takes a long time without a warm binary cache

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    strategy:
      matrix:
        build_type: [Debug, Release]
      fail-fast: false  # Don't cancel other jobs if one fails

    steps:
    - name: Free disk space
      run: |
        echo "Disk space before cleanup:"
        df -h
        # Remove unnecessary tools
        sudo rm -rf /Users/runner/Library/Android 2>/dev/null || true
        sudo rm -rf /usr/local/lib/android 2>/dev/null || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
        echo "Disk space after cleanup:"
        df -h

    - name: Select Xcode 16
      run: |
        XCODE_APP=$( (ls -d /Applications/Xcode_16*.app 2>/dev/null || true) | sort -V | tail -n 1)
        if [ -z "$XCODE_APP" ]; then
          echo "::error::No Xcode 16.x found on the runner"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"
        xcodebuild -version
        clang --version

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false  # Don't use recursive - it creates shallow clones

    - name: Initialize vcpkg submodule (full clone)
      run: |
        # Full clone required for vcpkg (shallow clone causes issues)
        git submodule update --init --recursive
        # Ensure vcpkg is not shallow (required for baseline resolution)
        cd vcpkg
        if git rev-parse --is-shallow-repository | grep -q true; then
          echo "Converting vcpkg to full clone..."
          git fetch --unshallow || true
        fi

    - name: Install dependencies
      run: |
        brew install cmake ninja autoconf autoconf-archive automake libtool python@3.11

    # vcpkg binary cache: zipped build results of every port, shared by the Debug
    # and Release jobs (the triplet builds both configurations). Ports whose ABI did
    # not change (same baseline, compiler and flags) are restored from it instead of
    # being rebuilt.
    - name: Prepare vcpkg binary cache directory
      run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: macos-clang-vcpkg-binary-v1-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          macos-clang-vcpkg-binary-v1-${{ hashFiles('vcpkg.json') }}-
          macos-clang-vcpkg-binary-v1-

    - name: Bootstrap vcpkg
      run: |
        if [ ! -f vcpkg/vcpkg ]; then
          echo "Bootstrapping vcpkg..."
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "vcpkg already bootstrapped"
          vcpkg/vcpkg version
        fi

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -G Ninja

    # Saved only by pushes to main (Release job only, both jobs produce the same ports),
    # as on Windows. Pull requests read main's cache but do not save their own: the
    # former cache of the whole vcpkg tree (~4 GB) was saved again by every pull request
    # and pushed the other caches out of the 10 GB repository limit, so the Windows jobs
    # rebuilt Qt for about 1.5 hours.
    - name: Save vcpkg binary cache
      if: matrix.build_type == 'Release' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: macos-clang-vcpkg-binary-v1-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --build-config ${{ matrix.build_type }}

    - name: Upload binaries (Release only)
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: kalahari-macos-${{ matrix.build_type }}
        path: |
          build/bin/kalahari*
        retention-days: 7
