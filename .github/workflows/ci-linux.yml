name: LINUX

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Linux Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # Fast with all system packages, no vcpkg

    strategy:
      matrix:
        build_type: [Release]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false  # No vcpkg needed for Linux

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install jinja2

    - name: Install all dependencies from apt (no vcpkg)
      timeout-minutes: 20
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # The archive mirror sometimes stops answering: each attempt has a time limit and
        # apt retries single downloads, so a stalled mirror costs minutes, not the whole job
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 15
        done
        # All dependencies from system packages - fast, reliable, no disk space issues
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
          build-essential g++ cmake ninja-build pkg-config \
          qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools \
          libgl1-mesa-dev libglu1-mesa-dev \
          libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
          libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev \
          libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
          libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
          libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
          libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
          libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev \
          libxkbcommon-dev libxkbcommon-x11-dev \
          libfontconfig1-dev libfreetype6-dev \
          libgtk-3-dev libdbus-1-dev \
          libdrm-dev libegl1-mesa-dev libgbm-dev \
          libinput-dev libmtdev-dev libudev-dev \
          libvulkan-dev libwayland-dev \
          libspdlog-dev nlohmann-json3-dev libzip-dev zipcmp zipmerge ziptool \
          libcurl4-openssl-dev libhunspell-dev catch2 \
          python3-dev pybind11-dev \
          xvfb
        echo "=== Installed versions ==="
        pkg-config --modversion Qt6Core Qt6Widgets Qt6Svg spdlog nlohmann_json libzip libcurl 2>/dev/null || true

    - name: Verify build tools
      run: |
        echo "=== Build tools ==="
        ninja --version
        g++ --version | head -1
        cmake --version | head -1
        echo "=== Disk space ==="
        df -h /

    - name: Configure CMake (system packages only)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DUSE_SYSTEM_PACKAGES=ON \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
          -G Ninja

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        cd build
        ctest --output-on-failure --build-config ${{ matrix.build_type }} --parallel 4

    - name: Upload binaries (Release only)
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: kalahari-linux-${{ matrix.build_type }}
        path: build/bin/kalahari*
        retention-days: 7

  # Debug build with AddressSanitizer + UndefinedBehaviorSanitizer, libstdc++ assertions
  # (out-of-range iterators and indices, ABI-compatible with system Qt) and line coverage.
  # On pull requests also runs clang-tidy on the changed lines only.
  analysis:
    name: Sanitizers, Coverage & clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # clang-tidy needs the base branch to compute the diff

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install jinja2 gcovr

    - name: Install dependencies from apt
      timeout-minutes: 20
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # The archive mirror sometimes stops answering: each attempt has a time limit and
        # apt retries single downloads, so a stalled mirror costs minutes, not the whole job
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 15
        done
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
          build-essential g++ cmake ninja-build pkg-config clang-tidy \
          qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools \
          libgl1-mesa-dev libxkbcommon-dev \
          libspdlog-dev nlohmann-json3-dev libzip-dev zipcmp zipmerge ziptool \
          libcurl4-openssl-dev libhunspell-dev catch2 \
          python3-dev pybind11-dev libssl-dev

    - name: Configure CMake (Debug, ASan + UBSan, coverage)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DUSE_SYSTEM_PACKAGES=ON \
          -DENABLE_ASAN=ON \
          -DENABLE_UBSAN=ON \
          -DCMAKE_CXX_FLAGS="--coverage -D_GLIBCXX_ASSERTIONS" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      # Full build: clang-tidy needs the generated sources of every target
      run: cmake --build build --parallel

    - name: Run tests under sanitizers
      env:
        ASAN_OPTIONS: detect_leaks=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        cd build
        # Python script tests load the module into a non-instrumented interpreter
        ctest --output-on-failure --parallel 4 --exclude-regex '^python\.'

    - name: Coverage report
      if: always()
      run: |
        mkdir -p build/coverage
        gcovr --root . build --filter 'src/' --exclude-throw-branches \
          --txt-summary --txt build/coverage.txt \
          --html-details build/coverage/index.html
        echo '### Line coverage (files compiled into tests)' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        tail -n 4 build/coverage.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage/
        retention-days: 14

    - name: clang-tidy on changed lines
      if: github.event_name == 'pull_request'
      run: |
        git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- '*.cpp' '*.h' \
          | clang-tidy-diff-18.py -p1 -path build -quiet -j 4

