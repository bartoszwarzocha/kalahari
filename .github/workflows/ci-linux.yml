name: LINUX

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# A new push to a pull request cancels the pull request's runs still in progress;
# every run on main and develop runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The PDFium of the preview of PDF files (vcpkg-ports/pdfium/release.cmake) is the one
  # pdfium-binaries built from the official sources: each pinned archive has its SHA-512, its
  # version, no JavaScript and XFA, and GitHub's signed record of its build
  pdfium:
    name: PDFium archives (SHA-512 and attestation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify the PDFium archives
      env:
        GH_TOKEN: ${{ github.token }}
      run: cmake -DWORK_DIR="$RUNNER_TEMP/pdfium" -P scripts/verify_pdfium.cmake

  build:
    name: Linux Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # System packages, no vcpkg: the build takes 19 to 28 minutes on the runner

    strategy:
      matrix:
        build_type: [Release]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false  # No vcpkg needed for Linux

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install jinja2

    # The same Qt version as the Windows and macOS builds (vcpkg), so the tests check the
    # Qt the program ships with. The Sanitizers job below keeps Ubuntu's Qt 6.4 and so
    # checks the oldest supported version
    - name: Install Qt 6.9.1
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.1'
        host: linux
        target: desktop
        arch: linux_gcc_64
        cache: true

    - name: Install all dependencies from apt (no vcpkg)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # The archive mirror sometimes stops answering: each update attempt has a time limit
        # and apt retries a download that stalls for 30 s. No limit on the whole step: a slow
        # but working mirror can take over 20 minutes to deliver the packages
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 15
        done
        # All dependencies from system packages - fast, reliable, no disk space issues
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
          build-essential g++ cmake ninja-build pkg-config \
          libgl1-mesa-dev libglu1-mesa-dev \
          libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
          libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev \
          libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
          libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
          libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
          libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
          libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xinput-dev \
          libxkbcommon-dev libxkbcommon-x11-dev \
          libfontconfig1-dev libfreetype6-dev \
          libgtk-3-dev libdbus-1-dev \
          libdrm-dev libegl1-mesa-dev libgbm-dev \
          libinput-dev libmtdev-dev libudev-dev \
          libvulkan-dev libwayland-dev \
          libspdlog-dev nlohmann-json3-dev libzip-dev zipcmp zipmerge ziptool \
          libcurl4-openssl-dev libhunspell-dev catch2 \
          python3-dev pybind11-dev \
          xvfb
        echo "=== Installed versions ==="
        pkg-config --modversion spdlog nlohmann_json libzip libcurl 2>/dev/null || true
        echo "Qt: $QT_ROOT_DIR"

    - name: Verify build tools
      run: |
        echo "=== Build tools ==="
        ninja --version
        g++ --version | head -1
        cmake --version | head -1
        echo "=== Disk space ==="
        df -h /

    - name: Configure CMake (system packages only)
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DUSE_SYSTEM_PACKAGES=ON \
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
          -G Ninja

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        cd build
        ctest --output-on-failure --build-config ${{ matrix.build_type }} --parallel 4

    # Editor speed on a 150k-word chapter, as a report: shared runners vary by 10-20 %,
    # so the numbers are for comparing runs by eye and never fail the build
    - name: Editor benchmark (report only)
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
        KALAHARI_TEST_MODE: 1
        KALAHARI_BENCH_OUT: ${{ github.workspace }}/build/editor_benchmark.md
      run: |
        ./build/bin/kalahari-tests "[benchmark][stage0]"
        echo '### Editor benchmark (150k words, Release, Qt 6.9.1)' >> "$GITHUB_STEP_SUMMARY"
        cat build/editor_benchmark.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload editor benchmark
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: editor-benchmark
        path: build/editor_benchmark.md
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload binaries (Release only)
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: kalahari-linux-${{ matrix.build_type }}
        path: build/bin/kalahari*
        retention-days: 7

  # Debug build with AddressSanitizer + UndefinedBehaviorSanitizer, libstdc++ assertions
  # (out-of-range iterators and indices, ABI-compatible with system Qt) and line coverage.
  # On pull requests also runs clang-tidy on the changed lines only.
  analysis:
    name: Sanitizers, Coverage & clang-tidy
    runs-on: ubuntu-24.04
    # Setup and build ~50 min, tests under the sanitizers ~27 min, coverage ~5 min; clang-tidy
    # of a pull request that changes hundreds of files (a clean-up of the whole code) takes two
    # hours or more on the runner's 4 cores (344 translation units: not done after 82 minutes);
    # GitHub stops any job at 360
    timeout-minutes: 350

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # clang-tidy needs the base branch to compute the diff

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install jinja2 gcovr

    - name: Install dependencies from apt
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # The archive mirror sometimes stops answering: each update attempt has a time limit
        # and apt retries a download that stalls for 30 s. No limit on the whole step: a slow
        # but working mirror can take over 20 minutes to deliver the packages
        for attempt in 1 2 3; do
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break
          if [ "$attempt" = 3 ]; then exit 1; fi
          sleep 15
        done
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
          build-essential g++ cmake ninja-build pkg-config clang-tidy \
          qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools \
          libgl1-mesa-dev libxkbcommon-dev \
          libspdlog-dev nlohmann-json3-dev libzip-dev zipcmp zipmerge ziptool \
          libcurl4-openssl-dev libhunspell-dev catch2 \
          python3-dev pybind11-dev libssl-dev

    - name: Configure CMake (Debug, ASan + UBSan, coverage)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DUSE_SYSTEM_PACKAGES=ON \
          -DENABLE_ASAN=ON \
          -DENABLE_UBSAN=ON \
          -DCMAKE_CXX_FLAGS="--coverage -D_GLIBCXX_ASSERTIONS" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      # Full build: clang-tidy needs the generated sources of every target
      run: cmake --build build --parallel

    - name: Run tests under sanitizers
      env:
        ASAN_OPTIONS: detect_leaks=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        cd build
        # Python script tests load the module into a non-instrumented interpreter
        ctest --output-on-failure --parallel 4 --exclude-regex '^python\.'

    - name: Coverage report
      if: always()
      run: |
        mkdir -p build/coverage
        # GCC 13 sometimes numbers the lines of a header one too low in a source file that
        # includes it (the preprocessor of that file says so too), so an inline function of
        # the header has two lines among the files: gcovr counts it once, at the higher line
        gcovr --root . build --filter 'src/' --exclude-throw-branches \
          --merge-mode-functions=merge-use-line-max \
          --txt-summary --txt build/coverage.txt \
          --html-details build/coverage/index.html
        # The same measurement for SonarQube (generic coverage format, paths relative to the
        # repository root), headers included; scripts/sonar_analysis.py downloads it
        gcovr --root . build --filter 'src/' --filter 'include/' --exclude-throw-branches \
          --merge-mode-functions=merge-use-line-max \
          --sonarqube build/coverage/sonarqube.xml
        echo '### Line coverage (files compiled into tests)' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        tail -n 4 build/coverage.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage/
        retention-days: 14

    - name: clang-tidy on changed lines
      if: github.event_name == 'pull_request'
      run: |
        # Hunks that add only // comments or blank lines (e.g. a licence header in every
        # file) cannot get a finding, but would make clang-tidy analyse their whole files.
        # A changed header is checked once, in a translation unit that includes it (with that
        # unit's include folders)
        git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- '*.cpp' '*.h' \
          | python3 .github/scripts/drop_comment_only_hunks.py \
          | python3 .github/scripts/clang_tidy_changed.py -p build -j 4 --clang-tidy clang-tidy-18

